services:
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  chatbot:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - db
volumes:
  postgres_data:
